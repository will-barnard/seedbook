server {
    # Listen on both IPv4 and IPv6. The custom default.conf makes the nginx
    # image skip its automatic IPv6 listener (see 10-listen-on-ipv6-by-default.sh),
    # so we add it explicitly — Beachhead's proxy resolves the upstream over
    # IPv6 and gets a 503 if nginx only listens on IPv4.
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS resolver. Resolving the backend hostname at
    # request time (not config-load time) avoids the cold-start
    # "host not found in upstream" crash when backend boots after frontend.
    # ipv6=off is required — without it Docker's DNS returns SERVFAIL on AAAA
    # lookups and requests fail with "backend could not be resolved".
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Proxy API + health to the backend service by its Docker service name.
    location /api/ {
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Follow-up generation can take a while on local models.
        proxy_read_timeout 300s;
    }

    location = /healthz {
        set $backend_health http://backend:3001;
        proxy_pass $backend_health;
    }

    # SPA fallback — any non-file route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
