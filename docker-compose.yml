# Seedbook — Beachhead-compatible compose.
#
# Beachhead rules honored here:
#  - no `version:` key
#  - `expose:` not `ports:` (Beachhead's nginx-proxy routes public traffic)
#  - no `container_name:` on any service (Beachhead assigns unique names)
#  - every service joins the explicit `internal` network
#  - postgres healthcheck has start_period: 30s
#  - postgres volume has a fixed `name:` so redeploys don't wipe data
#  - frontend nginx proxies to `backend` by service name (see frontend/nginx.conf)
#  - build uses explicit context + dockerfile
#  - postgres is declared stateful in beachhead.json
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - internal
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "3001"
    environment:
      DATABASE_URL: postgresql://seedbook:${DB_PASSWORD}@postgres:5432/seedbook
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-true}
      # dry-dock generate API (see DRYDOCK-API.md in the dry-dock repo)
      DRYDOCK_BASE_URL: ${DRYDOCK_BASE_URL}
      DRYDOCK_API_KEY: ${DRYDOCK_API_KEY}
      DRYDOCK_POOL: ${DRYDOCK_POOL:-researcher}
      # Resend reminder emails
      RESEND_API_KEY: ${RESEND_API_KEY}
      REMINDER_EMAIL_FROM: ${REMINDER_EMAIL_FROM}
      REMINDER_EMAIL_TO: ${REMINDER_EMAIL_TO}
      REMINDER_CRON: ${REMINDER_CRON:-0 9 * * *}
      REMINDER_TZ: ${REMINDER_TZ:-UTC}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: seedbook
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: seedbook
    volumes:
      - seedbook-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seedbook -d seedbook"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:

volumes:
  seedbook-postgres:
    name: seedbook-postgres
